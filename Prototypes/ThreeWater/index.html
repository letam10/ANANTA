<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ANANTA W2 Three.js coastal water QA prototype" />
    <title>ANANTA W2 Coastal Water QA</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #061321; }
      #water-canvas { display: block; width: 100%; height: 100%; }
      #hud { position: fixed; top: 16px; left: 16px; z-index: 4; max-width: 340px; }
      #hud h1 { margin: 0 0 6px; font-size: 18px; letter-spacing: .08em; }
      #hud p { margin: 4px 0; color: #b9d8e5; font-size: 12px; line-height: 1.4; }
      #status { color: #8de6ff; }
      #controls { opacity: .8; }
    </style>
  </head>
  <body>
    <canvas id="water-canvas" aria-label="Three.js water prototype"></canvas>
    <section id="hud" aria-live="polite">
      <h1>ANANTA W2 COASTAL WATER</h1>
      <p id="status">Loading wave field…</p>
      <p id="controls">1/2/3 scenes · C free camera · WASD/RF · B boundary · F foam · G storm swell · Space pause</p>
    </section>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
