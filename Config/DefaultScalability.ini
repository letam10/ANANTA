; City target: 1080p output, software Lumen, restrained shadow and reflection cost.
[AntiAliasingQuality@2]
r.TSR.History.ScreenPercentage=100

[GlobalIlluminationQuality@2]
r.Lumen.HardwareRayTracing=0
r.Lumen.ScreenProbeGather.DownsampleFactor=32

[ReflectionQuality@2]
r.Lumen.Reflections.DownsampleFactor=2

[ShadowQuality@2]
r.Shadow.Virtual.ResolutionLodBiasDirectional=0
r.Shadow.Virtual.ResolutionLodBiasLocal=1

[TextureQuality@2]
r.Streaming.PoolSize=3000

; Keep the same texture memory budget at Epic; this does not lower mip quality.
[TextureQuality@3]
r.Streaming.PoolSize=3000

; Hardware ray tracing is disabled by this project at every playable quality level.
[GlobalIlluminationQuality@3]
r.Lumen.HardwareRayTracing=0
; ANANTA Max: keep Lumen, reduce probe density and bilateral AO resolution.
r.Lumen.ScreenProbeGather.DownsampleFactor=24
r.Lumen.ScreenProbeGather.ShortRangeAO.DownsampleFactor=2

[ReflectionQuality@3]
r.Lumen.Reflections.DownsampleFactor=2

[AntiAliasingQuality@3]
; Native output remains 100 percent; only temporal history is 1080p instead of 4K.
r.TSR.History.ScreenPercentage=100

[ShadowQuality@3]
; Four soft-shadow rays and samples; retain VSM and detailed near shadow pages.
r.Shadow.Virtual.SMRT.RayCountDirectional=4
r.Shadow.Virtual.SMRT.RayCountLocal=4
r.Shadow.Virtual.SMRT.SamplesPerRayDirectional=4
r.Shadow.Virtual.SMRT.SamplesPerRayLocal=4
r.Shadow.Virtual.NonNanite.IncludeInCoarsePages=0
